services:
  postgres:
    image: postgres:16-alpine
    container_name: lacarta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lacarta
      POSTGRES_PASSWORD: lacarta
      POSTGRES_DB: lacarta
    ports:
      - "5432:5432"
    volumes:
      - lacarta_pgdata:/var/lib/postgresql/data

volumes:
  lacarta_pgdata:
