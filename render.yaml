# Blueprint de Render: crea la API y la app web desde este repositorio.
# Render -> New -> Blueprint -> elige el repo. Los valores con `sync: false`
# te los pide Render la primera vez (ver DEPLOY.md).
services:
  # ---------------------------------------------------------------- API
  - type: web
    name: lacarta-api
    branch: production # solo se despliega lo que llega a esta rama
    runtime: node
    plan: free
    rootDir: backend
    # NODE_ENV=development solo para instalar: así pnpm también instala las
    # devDependencies que necesita `nest build`. La API corre con NODE_ENV=production.
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Activa las reglas de producción de src/config/env.validation.ts
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # cadena de conexión de Neon
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SYNC
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "86400"
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_URL # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
        sync: false
      - key: CLOUDINARY_FOLDER
        value: lacarta
      - key: PUBLIC_URL # https://lacarta-api.onrender.com
        sync: false
      - key: CORS_ORIGINS # https://lacarta-web.onrender.com
        sync: false

  # ---------------------------------------------------------- App web (Flutter)
  - type: web
    name: lacarta-web
    branch: production
    runtime: static
    # Render no trae Flutter: el script lo descarga y compila (ver scripts/)
    buildCommand: bash scripts/render_build_web.sh
    staticPublishPath: build/web
    autoDeploy: true
    envVars:
      - key: API_URL # https://lacarta-api.onrender.com
        sync: false
    routes:
      # URLs limpias (/burger_house, /admin/orders): todo lo sirve index.html
      - type: rewrite
        source: /*
        destination: /index.html
